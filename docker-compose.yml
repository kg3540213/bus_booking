services:
  postgres:
    image: postgres:16-alpine
    container_name: bus_booking_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-bus_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bus_secure_pass}
      POSTGRES_DB: ${DB_NAME:-bus_booking_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-bus_admin} -d ${DB_NAME:-bus_booking_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bus_booking_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-bus_admin}
      DB_PASSWORD: ${DB_PASSWORD:-bus_secure_pass}
      DB_NAME: ${DB_NAME:-bus_booking_db}
      JWT_SECRET: ${JWT_SECRET:-nexbus_jwt_secure_key_2026_enterprise}
      JWT_EXPIRES_IN: 24h
      CLIENT_URL: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bus_booking_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
